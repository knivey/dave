# Services define API endpoints and shared defaults for chat/completion commands.
# Each service is a [section] referenced by name from commands via `service = "name"`.
# Command-level settings cascade: command override > service default > hardcoded default.
#
# Available options (per [section]):
#   key                  (string)          API key (not required for local/unauthed endpoints)
#   type                 (string, default: "openai")  "openai" or "llama" (omitted = openai behavior)
#   baseurl              (string)          API base URL (e.g. "https://api.openai.com/v1/")
#   maxtokens            (int)             Max tokens per response (legacy, prefer maxcompletiontokens)
#   maxcompletiontokens  (int)             Max completion tokens per response
#   temperature          (float)           Sampling temperature (0=deterministic, default: 0)
#   context_window       (int, default: 0) Model context window in tokens, used by auto-compaction thresholding ([compaction] auto_enabled). A per-command context_window overrides this; when unset here, [compaction] context_window is the final fallback
#   imageformat          (string, default: "jpg")  Image format: "jpg", "jpeg", or "webp"
#   imagequality         (int 1-100, default: 75)   Image quality percentage
#   maximagesize         (string, default: "1024x1024") Max image dimensions "WxH"
#   timeout              (duration, default: 60s)    Overall API call timeout (cascades to commands)
#   streamtimeout        (duration, default: timeout) Max idle time between stream chunks
#   load_notice          (bool, default: true when type = "llama", else false) Before each turn, GET /v1/models and send an IRC notice when the requested model is not loaded yet (llama-server router status: unloaded/loading/sleeping; llama-swap status-less list: model absent). Fails open — no notice when the endpoint errors. Set false to disable for llama services, true to enable for others. Cascades to commands.
#   toolverbose          (bool, default: true)       Show 🔧 tool call notifications in IRC
#   needsusersuffix      (*bool, default: auto)      Guidance Knob 2 (cascades to commands): append a short user message after injected guidance when it would be the last message of the request. Auto (unset) appends it for anthropic/ models; true forces it, false suppresses it.
#   injection_role       (string, default: "system") Guidance Knob 1 (cascades to commands): wire role for injected guidance payload rows ("system" | "developer" | "user"). "developer" maps to system server-side on llama.cpp; "user" is for models whose templates cannot render mid-chain system at all.
#   async_result_delivery (string, default: "message") (cascades to commands) How completed background jobs are delivered: "message" = guidance row per the knobs above; "tool" = synthetic assistant tool-call + tool-result round-trip, for smaller models that handle mid-chain guidance poorly.
#   paralleltoolcalls    (bool, default: true)       Enable parallel MCP tool calls
#   parallel             (int, default: 1)           Max concurrent requests per command
#   api_user             (string)                    Go template for the end-user identifier field (cascades to commands). Sent as safety_identifier + prompt_cache_key on OpenAI/xAI (prompt_cache_key on xAI chat completions rides the x-grok-conv-id header), user on OpenRouter chat completions and unknown providers. Variables: {{.Nick}}, {{.BotNick}}, {{.Channel}}, {{.Network}}, {{.Date}}, {{.SessionID}}, {{.AsyncResultRole}}, {{.Vars.*}}. Empty = not sent.
#   disabled_builtin_tools (string array)            Builtin LLM tools to disable for commands using this service. Cascade: command > service > root default ([]). Nil = inherit.
#   hidden_mcp_tools     (string array)              MCP tool names to hide from the LLM. Bare names ("tool") or server-prefixed ("server.tool"). Cascade: command > service > root.
#   hidden_mcp_tool_sets (string array)              Named tool sets from mcps.toml [hidden_mcp_tool_sets.*]. Merged with hidden_mcp_tools. Cascade: command > service > root.
#
# Duration values: TOML strings like "30s", "2m", "1m30s".
#
# Example with all options:
# [example-service]
# key = "sk-..."
# type = "openai"
# baseurl = "https://api.openai.com/v1/"
# maxtokens = 500
# maxcompletiontokens = 600
# temperature = 0.7
# context_window = 200000
# imageformat = "jpg"
# imagequality = 75
# maximagesize = "1024x1024"
# timeout = "90s"
# streamtimeout = "45s"
# load_notice = true
# needsusersuffix = true
# injection_role = "system"
# async_result_delivery = "message"
# toolverbose = true
# paralleltoolcalls = true
# parallel = 1
# api_user = "dave/{{.Network}}/{{.Nick}}:s{{.SessionID}}"
# disabled_builtin_tools = ["ban_user"]
# hidden_mcp_tools = ["wait_for_job"]
# hidden_mcp_tool_sets = ["img-async-management"]

[openai]
key = "UR KEY HERE :P"
maxcompletiontokens = 600
baseurl = "https://api.openai.com/v1/"
temperature = 0.7  # optional
imageformat = "jpg"      # default image format for chat commands
imagequality = 75
maximagesize = "1024x1024"
# toolverbose = false  # hide 🔧 tool call notifications in IRC (default: true)
# paralleltoolcalls = true  # Enable parallel MCP tool calls (default: true, cascades to commands)

[local]
maxtokens = 500
baseurl = "http://192.168.100.45:8000/v1"
temperature = 0.7  # optional
#this is just a default that can be overriden in command configs
#if left undefined it defaults to 8
#its the most number of previous interactions (including ai responses) to send back for context
maxhistory = 8
imageformat = "jpg"
imagequality = 75
maximagesize = "1024x1024"

[grok]
key = "xai-YOUR-KEY-HERE"  # Grok/x.ai API key
maxtokens = 6000
baseurl = "https://api.x.ai/v1/"
temperature = 0.7  # optional creativity (0=deterministic)
imageformat = "jpg"
imagequality = 75
maximagesize = "1024x1024"

[sd]
baseurl = "http://192.168.100.45:7860"

[comfy]
baseurl = "http://192.168.100.45:8188"
comfy_timeout = 300
temperature = 0.7  # optional