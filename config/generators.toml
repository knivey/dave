# Generators: one-shot, stateless agentic commands. The prompt is built from
# the system template + one user message (your verbatim args), then run
# through the full agentic tool loop once — the model retrieves channel logs
# itself (query_channel_logs) and delivers its answer (respond tool, or its
# final no-tool-call reply). Nothing is persisted: no session, no messages,
# no compaction. Each section name becomes the command trigger. Use `aliases`
# for additional triggers.
#
# Available options (per [section]):
#   service              (string, required)         Service name from services.toml
#   model                (string)                    Model name (e.g. "qwen3-32b")
#   aliases              (string array, default: []) Additional trigger names for this command
#   description          (string)                    Short description for help listings
#   system               (string)                    System prompt (supports Go templates)
#   streaming            (bool, default: false)      Stream responses from the API. On generators text
#                                               is never typed live into IRC — emission is deferred
#                                               and the final answer arrives as one complete message
#                                               (chunk logging, usage capture, stream timeouts
#                                               still apply).
#   rendermarkdown       (bool, default: false)      Convert markdown to IRC formatting
#   respond_tool         (bool, default: false)      Offer the respond tool; the model submits its
#                                               final answer through it and the turn ends there.
#                                               When false (or the model finishes with plain text),
#                                               the final no-tool-call reply is sent automatically.
#                                               Intermediate model text is never sent to IRC either way.
#                                               The query_channel_logs and respond tools are offered
#                                               ONLY on generator turns — chat commands never see them.
#   maxtokens            (int, cascades from service)     Max tokens per response (legacy, prefer maxcompletiontokens)
#   maxcompletiontokens  (int, cascades from service)     Max completion tokens per response
#   temperature          (float, cascades from service)   Sampling temperature
#   topp                 (float, omitted when unset, API default typically 1.0)  Nucleus sampling (0-1)
#   stop                 (string array)              Stop sequences
#   presencepenalty      (float, default: 0)         -2.0 to 2.0, penalize new topics
#   frequencypenalty     (float, default: 0)         -2.0 to 2.0, penalize repetition
#   timeout              (duration, default: 60s)    Overall API call timeout. Cascade: command > service > 60s
#   streamtimeout        (duration, default: timeout) Max idle time between stream chunks. Cascade: command > service > timeout
#   load_notice          (bool, default: true for type = "llama" services, else false) Before the turn, probe the service's /v1/models and send a "loading model" IRC notice when the requested model is not loaded yet (llama-server built-in router / llama-swap model swap). Notice text: [llm] model_load in notices.toml. Cascade: command > service > type default.
#   toolverbose          (bool, default: true)       Show 🔧 tool call notifications in IRC (cascades from service)
#   paralleltoolcalls    (bool, default: true)       Enable parallel MCP tool calls (cascades from service)
#   reasoningeffort      (string)                    For o1/o3 models: "low", "medium", "high"
#   reasoningsummary     (string)                    Responses API only: request reasoning summaries back. "auto", "concise", or "detailed". Empty = not requested (no summaries returned).
#   servicetier          (string)                    Processing tier: "auto", "default", "flex", "priority"
#   verbosity            (string)                    Output token count for gpt-5: "low", "medium", "high"
#   mcps                 (string array)              Opt-in MCP server names for tool access
#   hidden_mcp_tools     (string array)              MCP tool names to hide from the LLM. Bare names ("tool") or server-prefixed ("server.tool"). Cascade: command > service > root.
#   hidden_mcp_tool_sets (string array)              Named tool sets from mcps.toml [hidden_mcp_tool_sets.*]. Merged with hidden_mcp_tools. Cascade: command > service > root.
#   extra_body           (map)                       Provider-specific parameters (top-level in request body)
#   chat_template_kwargs (map)                       Provider-specific parameters (nested in request body)
#   responses_api        (bool, default: false)      Use POST /v1/responses instead of Chat Completions (response ids are never persisted for generators — only the endpoint shape changes)
#   injection_role       (string, default: "system") Guidance Knob 1: wire role for injected guidance payload rows ("system" | "developer" | "user"); on generator turns this is the empty-response correction. "developer" maps to system server-side on llama.cpp; "user" is for models whose templates cannot render mid-chain system at all. Cascade: command > service > "system".
#   needsusersuffix      (*bool, default: auto)       Guidance Knob 2: append a short user message after injected guidance when it would be the last message of the request (empty-response corrections — the only guidance site on generator turns). Auto (unset) appends it for anthropic/ models; true forces it, false suppresses it. Cascade: command > service > auto. Fix for: "This model does not support assistant message prefill. The conversation must end with a user message."
#   api_user             (string, cascades from service)  Go template for the end-user identifier field. Variables: {{.Nick}}, {{.BotNick}}, {{.Channel}}, {{.Network}}, {{.Date}}. Empty = not sent.
#   retry_on_empty       (int, default: 1)           Number of retries when API returns empty response (0 = disabled); retry corrections are injected per injection_role/needsusersuffix and never persisted
#   prompt               (string)                    Default instruction when the caller gives no focus text.
#                                               Fallback chain: focus text > prompt > built-in default.
#
# Log-fed commands add a sub-table that configures the query_channel_logs
# tool offered to the model — window is the tool's default window, max_tokens
# the per-call transcript budget, events the transcript shape. The model can
# call the tool multiple times with different windows; caps are host-enforced.
# (A [section.log] also makes the command's args optional — bare "^name"
# dispatches too; the model maps any time range in the request to the tool's
# window argument. Without it, args are required.)
#   [section.log]
#   window               (duration string, default: "24h") The tool's DEFAULT window — how far back the
#                                               transcript reaches when the model omits the window
#                                               argument. Units: s/m/h/d, compound allowed ("1d12h").
#   events               (string array, default: ["PRIVMSG", "NOTICE", "TOPIC", "KICK"])
#                                               Transcript shape — which loggable events the
#                                               transcript includes: PRIVMSG, NOTICE, JOIN, PART,
#                                               QUIT, KICK, NICK, TOPIC, MODE.
#                                               NOTE: QUIT and NICK are network-scoped in the logs (no channel) and never match
#                                               a channel query — including them has no effect.
#   max_tokens           (int, default: 60000)          Per-call token budget for the transcript; over budget
#                                               the NEWEST lines are kept, the result header reports
#                                               kept/total/dropped/budget, and a truncation marker is
#                                               prepended (instruct the model to disclose it). Every
#                                               call gets the full budget; multi-call is bounded only
#                                               by the 20-iteration tool-loop cap.
#
# Both generator tools (query_channel_logs, respond) are hidden by default —
# the root hidden_tools default is ["register_background_job",
# "check_ban_history", "query_channel_logs", "respond"], so no 🔧 tool-call
# IRC notice fires unless an admin unhides them; toolverbose = false silences
# 🔧 tool-call notices entirely — recommended for output-sensitive commands
# (tabloid, fakenews). disabled_builtin_tools DOES apply to the generator
# tools (cascade: command > service > root — a disabled call returns an
# error tool result naming the disable); the builtin LLM tools themselves
# (register_background_job, ban tools) are never offered on generator turns.
#
# Not useful for generators (stateless): previous_response_id, detectimages,
# context_window (no compaction on ephemeral turns — nothing is persisted to
# compact), async_result_delivery (no background jobs for generators —
# session-bound).
#
# Requires [logging] enabled in config.toml — the query_channel_logs tool
# reads data/logs/*.db.
#
# Example with all generator-only options:
# [example]
# service = "local"
# model = "qwen3-32b"
# streaming = true
# rendermarkdown = true
# respond_tool = true
# toolverbose = false
# mcps = ["img-mcp"]
# hidden_mcp_tools = ["generate_image_async", "enhance_and_generate_async", "wait_for_job", "job_status", "list_jobs", "cancel_job"]
# prompt = "Write a satirical article about the given topic."
# system = "You are {{.BotNick}}, a tabloid hack for {{.Channel}} on {{.Network}}. Mine query_channel_logs for material; deliver the finished article with the respond tool."
# [example.log]
# window = "24h"
# events = ["PRIVMSG", "NOTICE", "TOPIC", "KICK"]
# max_tokens = 60000

[summary]
description = "Summarize recent channel activity"
service = "local"
model = "qwen3-32b"
streaming = true
rendermarkdown = true
respond_tool = true
prompt = "Summarize recent channel activity."
system = """\
You are {{.BotNick}}, summarizing recent activity in {{.Channel}} on {{.Network}}.
First call query_channel_logs to retrieve the channel transcript — map any
time range in the request (e.g. "7d", "since yesterday", "the last 12 hours")
to the window argument, defaulting to the tool's default when none is given.
Then summarize: cover the main topics, notable events, and who participated;
be concise but specific. If the result reports truncated or dropped lines
(header or marker), tell the user that coverage starts mid-window and how
much was dropped. Deliver your complete summary with the
respond tool.\
"""
[summary.log]
window = "24h"
events = ["PRIVMSG", "NOTICE", "TOPIC", "KICK"]
max_tokens = 60000
