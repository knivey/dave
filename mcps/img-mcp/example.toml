# Example configuration for img-mcp
# Copy this file to config.toml, prod.toml, or test.toml and fill in your values

[server]
# Server identification
name = "img-mcp"
version = "0.1.0"
# HTTP server address (only used in HTTP mode)
addr = ":8080"

[database]
# Database path for job persistence (relative to binary directory)
path = "data/img-mcp.db"

[comfy]
# ComfyUI server URL
baseurl = "http://localhost:8188"
# Timeout in seconds for ComfyUI requests. Workflow timeouts inherit this by
# default; the generation-monitor budget starts when monitoring begins, so
# with queue.max_workers > 1 it also absorbs the time a prompt waits inside
# ComfyUI's queue behind another worker's generation.
timeout = 90
# Default workflow name (must match one of the [workflow.*] sections below)
default_workflow = "zimage"

[upload]
# imgsite base URL for hosting generated images (required).
#   POST <url>/updo  (X-API-Key, multipart "file" + "meta") -> 201 + {id,url,page,...}
# The response's "page" (the absolute details-page link) is what gets pasted
# to IRC verbatim; an empty "page" (older imgsite) falls back to the direct
# "url" with a WARN.
url = "https://img.example.com"
# API key authenticating uploads to imgsite (X-API-Key header); must match
# auth.api_key in imgsite's config. Hot-reloadable (read per upload call).
# Empty is allowed at startup, but every upload will be rejected with 401
# until it is set.
api_key = "CHANGE_ME_TO_MATCH_IMGSITE_AUTH_API_KEY"

[queue]
# Maximum number of concurrent image generation workers. Values above 1 let
# the next job's enhancement/upload overlap with the current job's ComfyUI
# wait; GPU work stays serialized by ComfyUI's own internal queue.
max_workers = 2
# Maximum queue depth (number of pending jobs)
max_depth = 100
# How long to keep job results in memory (e.g., "1h", "30m", "24h")
result_ttl = "1h"

[auth]
# Shared secret for authenticating HTTP requests (required in HTTP mode, ignored in stdio mode).
# Requests must include the X-API-Key header with this value.
# Not reloadable — changes require restart.
api_key = "CHANGE_ME_TO_A_STRONG_RANDOM_SECRET"

# Network policies map IRC network names to enhancement profiles.
# When dave sends a request from a known network, the policy overrides
# which enhancement profile is used. If force=true, even raw generate_image
# calls are run through enhancement first.
#
# [network_policy.<network-name>]
# enhancement = "name"     # Required. Name of an [enhancement.*] profile to use.
# force = false            # If true, force enhancement on generate_image calls too.

# Example: enforce content policy on Libera
# [network_policy.libera]
# enhancement = "libera-safe"
# force = true

# Safety classification for the safe-site split (second pass). The vet is a
# reserved enhancement entry: its prompt sees the original and enhanced
# prompts and returns {"safe": true|false, "reason": "..."}. It runs
# CONCURRENTLY with generation (never delaying the submit); its verdict is
# what gates the safe site. Failures degrade to "unknown" and never fail
# the job. The whole block is hot-reloadable.
[safety]
# Name of the [enhancement.*] entry performing the strict judgment.
# Default: "safety-vet".
vet_enhancement = "safety-vet"
# Networks whose jobs skip classification entirely (case-insensitive).
# Default: ["libera"]; an explicit empty list means "vet everything". Keep
# in correspondence with imgsite's [safe_site] allowed_networks —
# separately configured by convention, like upload.api_key vs imgsite's
# auth.api_key.
skip_networks = ["libera"]

# Example: the safety vet (DRAFT judging prompt — tune to your policy; it
# must return the JSON verdict below and nothing else).
# [enhancement.safety-vet]
# description = "Strict second-pass safety judgment for the safe site"
# baseurl = "https://api.x.ai/v1/"
# key = "YOUR_API_KEY_HERE"
# model = "grok-4.6"
# systemprompt = """You are a strict content-safety reviewer for AI image generation.
# You will receive the original prompt and the enhanced prompt actually used
# for generation. Judge what the imagery would depict.
#
# Respond with JSON only: {"safe": true|false, "reason": "<one sentence>"}
# - "safe": false when the prompts request or clearly imply sexual, nude, or
#   otherwise explicit imagery (the safe-site audience must never see it)
# - "safe": true otherwise
# When genuinely unsure, answer safe=false — the safe site default-denies.
# Never refuse; always answer the JSON."""
# timeout = 30

[enhancement.default]
# Prompt enhancement settings (optional)
description = "General purpose image prompt enhancer"
# LLM API endpoint for prompt enhancement
baseurl = "https://api.x.ai/v1/"
# API key for the LLM service
key = "YOUR_API_KEY_HERE"
# Model to use for enhancement (grok-4-1-fast family retired 2026-05-15; use
# canonical slugs like grok-4.6)
model = "grok-4.6"
# System prompt for the enhancement model
systemprompt = "You are an expert at writing prompts for AI image generation..."
# Timeout in seconds for enhancement requests
timeout = 30
# Use the OpenAI Responses API (POST /v1/responses) instead of Chat Completions.
# Captures reasoning summaries in the img-mcp log for reasoning models.
responses_api = false
# Reasoning effort for reasoning models ("low", "medium", "high"; Grok 4.7
# also accepts "xhigh"). Sent on both API paths. Leave unset for non-reasoning
# models — an empty value sends nothing.
# reasoning_effort = "low"

# Safety first pass (loose networks only — do NOT add this to libera-safe,
# whose prompt refuses instead of flagging): append a line like this to the
# enhancement systemprompt so sexual content is flagged in the response JSON:
#   Include "nsfw": true in your response when the request or the enhanced
#   result contains sexual content; otherwise set "nsfw": false.
# The response schema declares and requires "nsfw", so strict structured-
# output providers always emit it; non-strict providers that omit the key
# decode as false. Absent or false never asserts safety — it only means "no
# first-pass signal" and the strict second-pass vet (see [safety] below)
# still runs.

# Example: content-safe enhancement for networks with strict content policies (e.g., Libera)
# [enhancement.libera-safe]
# description = "Content-safe prompt enhancer for Libera"
# baseurl = "https://api.x.ai/v1/"
# key = "YOUR_API_KEY_HERE"
# model = "grok-4.6"
# systemprompt = """You enhance prompts for AI image generation with strict content safety enforcement.
#
# REFUSE (set refused=true) any prompt requesting or implying:
# - Racism, hate speech, or discrimination against protected groups
# - Child sexual abuse material (CSAM) or sexualization of minors
# - Graphic violence, gore, or death depicted realistically
# - Harassment, bullying, or targeted attacks on real individuals
# - Content that is illegal under applicable law
#
# When you refuse, briefly state why in the reason field.
# For acceptable prompts, produce an enhanced prompt optimized for image generation
# and a negative prompt. Keep the enhancement style consistent and creative."""
# timeout = 30

[workflow.zimage]
# Workflow configuration for each ComfyUI workflow
description = "Z Image Turbo. Fast generation with lower quality."
# Path to the workflow JSON file (relative to config file location)
workflow_path = "workflows/z_image_turbo.json"
# Client ID to use for ComfyUI. Used as a base prefix: each job appends
# "-<job_id>" at submit and monitor time so concurrent monitors get their
# own websocket push stream (ComfyUI evicts same-clientId reconnects).
clientid = "img-mcp"
# Node IDs from the workflow (these depend on your specific ComfyUI workflow)
output_node = "28"
prompt_node = "6"
negative_prompt_node = "7"
seed_nodes = ["3"]
# prompt_input (string, default "text") — the prompt node's input key the
#   prompt is written to (Qwen Image 2.1's TextEncodeQwenImage21 names it
#   "prompt").
# image_input_node (string, default "") — node whose images.image_N inputs
#   receive the edit input images (wired dynamically, one LoadImage per
#   image; edit workflows only).
# denoise_node (string, default "") — node whose inputs.denoise receives the
#   edit strength; unset keeps the workflow file's own default.
# Expected generation time for ETA calculations
typical_time = "30s"

# Real-world example EDIT workflow (Qwen Image 2.1): the workflow file
# carries NO LoadImage nodes — prepare wires the edit inputs dynamically.
# prompt_input/image_input_node/denoise_node are only consulted by the edit
# tools.
# [workflow.qwen-edit]
# workflow_path = "workflows/qwen_image_2_1_edit.json"
# clientid = "img-mcp-qwen-edit"
# output_node = "515"
# prompt_node = "510"
# prompt_input = "prompt"        # TextEncodeQwenImage21 names its prompt input "prompt" (default "text")
# image_input_node = "510"       # its images.image_N slots get the edit inputs (wired dynamically)
# denoise_node = "507"           # strength -> KSampler denoise (1.0 = official turbo path, lower = subtler)
# seed_nodes = ["507"]
# timeout = 300
# description = "Qwen Image 2.1 edit — first image is the target (output follows its size); mention images in the prompt as <image1>, <image2>, ... (up to 10)"

# Add more [workflow.*] sections for additional workflows
# The workflow name (e.g., "zimage") is what you'll use in tool calls

# Per-workflow enhancement instructions (optional):
# Add a "dave_enhancement_instructions" pseudo-node to any workflow JSON file
# to steer prompt enhancement for that workflow. img-mcp extracts its text and
# appends it (on a new line) to the enhancement LLM's system prompt, then
# strips the node before submitting to ComfyUI — it never reaches the server.
# Edits to workflow files apply to the next job (files are read per job).
#
#   "dave_enhancement_instructions": {
#     "inputs": {"text": "Steer toward highly detailed photorealism; avoid anime stylization."},
#     "class_type": "dave_enhancement_instructions",
#     "_meta": {"title": "dave enhancement instructions (stripped before submit)"}
#   }
#
# Omit the node for workflows that need no extra steering. Only
# enhance_and_generate jobs consume it; plain generate_image jobs just strip it.
