# allowed_networks = ["libera"]

# ---- live configuration ---------------------------------------------------

[server]
name = "imgsite"
addr = ":8081"
base_url = ""

[database]
path = "data/imgsite.db"

[storage]
path = "data/images"
thumbs_path = "data/thumbs"

[auth]
api_key = "CHANGE_ME_TO_A_STRONG_RANDOM_SECRET"

[thumbnails]
small_width = 480
display_width = 1280
jpeg_quality = 78
workers = 2
max_dimension = 8192

[upload]
max_bytes = 33554432
rate_per_minute = 30

[search]
snippet_chars = 160
prefix_min = 2

[site]
title = "dave's image dump"
description = "generations from IRC"
